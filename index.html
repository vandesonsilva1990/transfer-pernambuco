<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transfer Litoral Pernambuco</title>
    <script>
        function redirecionarPorIdioma() {
            const idiomaUsuario = navigator.language || navigator.userLanguage;
            const idiomaSimplificado = idiomaUsuario.substring(0, 2).toLowerCase();

            if (idiomaSimplificado === 'es') {
                window.location.href = "espanhol.html";
            } else if (idiomaSimplificado === 'en') {
                window.location.href = "ingles.html";
            } else {
                window.location.href = "portugues.html";
            }
        }
        window.onload = redirecionarPorIdioma;
    </script>
</head>
<body style="background-color: #f0f8ff; font-family: 'Segoe UI', Arial, sans-serif; text-align: center; padding-top: 100px; color: #333;">
    <p style="font-size: 18px; font-weight: bold;">Redirecting to your language...</p>
    <p style="font-size: 16px; color: #666;">Redirecionando para o seu idioma...</p>
</body>
</html>
